<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F0B08">
  <title>העמוד לא נמצא · יובל אלקובי</title>
  <meta name="robots" content="noindex">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23D4AF37'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/main.css">
  
  <style>
    .error-wrap {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .error-card { max-width: 520px; }
    .error-404 {
      font-family: var(--font-sans);
      font-weight: 800;
      font-size: clamp(4rem, 15vw, 6.5rem);
      margin-bottom: -10px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      line-height: 1;
    }
    .error-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    .error-sub {
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 36px;
    }
    .ty-bg-glow {
      position: fixed;
      top: -15%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(245, 231, 184, 0.25), rgba(245, 231, 184, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }
    .error-btn {
      display: inline-block;
      min-height: 48px;
      padding: 14px 34px;
      border-radius: 12px;
      background: var(--cta-gradient);
      color: #1A1410;
      font-weight: 700;
      font-size: 1.05rem;
      box-shadow: var(--shadow-cta);
      transition: box-shadow .25s var(--ease), transform .2s var(--ease);
    }
    .error-btn:hover {
      box-shadow: var(--shadow-cta-hover);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="theme-light">

<div class="ty-bg-glow" aria-hidden="true"></div>

<main class="error-wrap">
  <div class="error-card">
    <div class="error-404">404</div>
    <h1 class="error-title">נראה שהלכת לאיבוד...</h1>
    <p class="error-sub">
      העמוד שחיפשת לא נמצא.<br>
      יכול להיות שהקישור שבור, או שהעמוד הוסר.
    </p>
    <a href="index.html" class="error-btn">חזרה למקום בטוח</a>
  </div>
</main>

</body>
</html>
