<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F0B08">
  <title>תודה · המדיטציה בדרך</title>
  <meta name="description" content="תודה שהצטרפת — המדיטציה נשלחה למייל שלך.">
  <meta name="robots" content="noindex">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23D4AF37'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/main.css">

  <style>
    .ty-wrap {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .ty-card { max-width: 520px; }
    .ty-heart {
      font-size: 2.4rem;
      margin-bottom: 12px;
    }
    .ty-title {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: clamp(2rem, 6vw, 2.8rem);
      margin-bottom: 16px;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .ty-sub {
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .ty-btn {
      display: inline-block;
      min-height: 48px;
      padding: 14px 30px;
      border-radius: 12px;
      background: var(--cta-gradient);
      color: #1A1410;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: var(--shadow-cta);
      transition: box-shadow .25s var(--ease), transform .2s var(--ease);
    }
    .ty-btn:hover {
      box-shadow: var(--shadow-cta-hover);
      transform: translateY(-2px);
    }
    .ty-bg-glow {
      position: fixed;
      top: -15%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(245, 231, 184, 0.28), rgba(245, 231, 184, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

<div class="ty-bg-glow" aria-hidden="true"></div>

<main class="ty-wrap">
  <div class="ty-card">
    <div class="ty-heart" aria-hidden="true">❤️</div>
    <h1 class="ty-title">תודה</h1>
    <p class="ty-sub">
      המדיטציה בדרך למייל שלך.<br>
      בדקי את תיבת הדואר הנכנס (ואולי גם את תיקיית הספאם).
    </p>
    <a href="index.html" class="ty-btn">חזרה לדף הבית</a>
  </div>
</main>

</body>
</html>
